<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestor de Obras Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    @keyframes bounce-custom {
      0%, 100% { transform: scaleY(0.3); opacity: 0.5; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    .animate-box-bounce { animation: bounce-custom 1s infinite ease-in-out; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // URL de tu Apps Script (Debe ser la URL de ejecución /exec)
    const API_URL = "https://script.google.com/macros/s/AKfycbxmPBIboe_Evn45ZHjtkjydbmlPRMuSax_sEiTc2iN8cqqi2i4-Pf_lOd6875cQXEd_yg/exec";

    // --- COMPONENTES DE ICONOS (Inline SVG para máxima compatibilidad) ---
    const IconBack = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
    const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>;
    const IconCopy = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>;
    const IconSave = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
    const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>;
    const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
    const IconPaperclip = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.44 11.05-8.49 8.49a5.5 5.5 0 0 1-7.78-7.78l8.48-8.49a3.5 3.5 0 1 1 4.95 4.95l-8.49 8.48a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"/></svg>;
    const IconMap = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
    const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;

    // --- COMPONENTE CARGADOR ---
    const BoxLoader = ({ message = "Cargando datos..." }) => (
      <div className="flex flex-col items-center justify-center p-12 space-y-6">
        <div className="flex items-end justify-center space-x-2 h-10">
          {[0, 0.15, 0.3, 0.45].map((delay, i) => (
            <div key={i} className="w-3 bg-indigo-600 rounded-sm animate-box-bounce h-full" style={{ animationDelay: `${delay}s`, transformOrigin: 'bottom' }} />
          ))}
        </div>
        <p className="text-slate-500 font-medium animate-pulse text-sm">{message}</p>
      </div>
    );

    const Toast = ({ message, type, onClose }) => {
      if (!message) return null;
      useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, [message]);
      const color = type === 'error' ? 'bg-red-600' : 'bg-slate-800';
      return (
        <div className={`fixed bottom-6 left-4 right-4 ${color} text-white p-4 rounded-xl shadow-lg z-50 flex justify-between items-center`}>
          <span className="text-sm font-medium">{message}</span>
          <button onClick={onClose} className="text-xs font-bold opacity-70">CERRAR</button>
        </div>
      );
    };

    const RECENT_OBRAS_KEY = "recentObras";
    const MAX_RECENT = 3;
    const DEFAULT_OBRA = {
      id: '',
      nombre_obra: '',
      ubicacion: '',
      estatus: 'Consolidación',
      tipo_obra: '',
      superficie: '',
      precio_lista: '',
      precio_venta: '',
      fecha_registro: '',
      fecha_adquisicion: '',
      fecha_venta: '',
      cliente: '',
      observaciones: '',
      id_responsable: '',
      autor: '',
      asignacion: '',
      provenance: '',
      clave: 'Pendiente',
      ancho: '',
      alto: '',
      largo: '',
      tags: []
    };

    function getRecentIds() {
      try { return JSON.parse(localStorage.getItem(RECENT_OBRAS_KEY) || "[]"); } catch (e) { console.error("Error parsing recent obras from localStorage:", e); return []; }
    }

    function saveRecentId(id) {
      const ids = getRecentIds().filter(x => x !== id);
      ids.unshift(id);
      localStorage.setItem(RECENT_OBRAS_KEY, JSON.stringify(ids.slice(0, MAX_RECENT)));
    }

    // --- APP PRINCIPAL ---
    function App() {
      const [view, setView] = useState("list");
      const [loading, setLoading] = useState(true);
      const [obras, setObras] = useState([]);
      const [comisiones, setComisiones] = useState([]);
      const [search, setSearch] = useState("");
      const [filterStatus, setFilterStatus] = useState("");
      const [filterTipo, setFilterTipo] = useState("");
      const [filterProvenance, setFilterProvenance] = useState("");
      const [filterAutor, setFilterAutor] = useState("");
      const [currentObra, setCurrentObra] = useState(null);
      const [toast, setToast] = useState({ message: '', type: '' });
      const [saving, setSaving] = useState(false);
      const [recentIds, setRecentIds] = useState(() => getRecentIds());

      useEffect(() => { fetchAllData(); }, []);

      const fetchAllData = async () => {
        setLoading(true);
        try {
          const res = await fetch(API_URL);
          const data = await res.json();
          if (data.registrosObra) {
            setObras(data.registrosObra.map(o => ({
              ...o,
              ancho: o.ancho === '' || o.ancho === null || o.ancho === undefined ? '' : ((parseFloat(o.ancho) || 0) * 100),
              alto: o.alto === '' || o.alto === null || o.alto === undefined ? '' : ((parseFloat(o.alto) || 0) * 100),
              largo: o.largo === '' || o.largo === null || o.largo === undefined ? '' : ((parseFloat(o.largo) || 0) * 100),
            })));
            setComisiones(data.comisiones || []);
          }
        } catch (e) { showToast("Error al conectar", "error"); }
        finally { setTimeout(() => setLoading(false), 800); }
      };

      const showToast = (message, type = 'success') => setToast({ message, type });
      const activateOnKey = (event, action) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          action();
        }
      };

      const openDetail = (obra) => {
        saveRecentId(obra.id);
        setRecentIds(getRecentIds());
        setCurrentObra(obra);
        setView("detail");
      };
      const handleCreateNewObra = () => {
        setCurrentObra({ ...DEFAULT_OBRA, id: Date.now().toString(), fecha_registro: new Date().toISOString().split('T')[0] });
        setView("form");
      };

      const handleCopyInfo = () => {
        const prov = comisiones.find(c => c.id === currentObra.provenance)?.provenance || currentObra.provenance || "No definida";
        const textToCopy = `
Ficha de Obra: ${currentObra.nombre_obra || 'N/A'}
Clave: ${currentObra.clave || 'N/A'}
Estatus: ${currentObra.estatus || 'N/A'}
Tipo: ${currentObra.tipo_obra || 'N/A'}
Autor: ${currentObra.autor || 'N/A'}
Ubicación: ${currentObra.ubicacion || 'N/A'}
Precio Lista: $${(currentObra.precio_lista || 0).toLocaleString()}
Precio Venta: $${(currentObra.precio_venta || 0).toLocaleString()}
Superficie: ${currentObra.superficie || 0} m²
Cliente: ${currentObra.cliente || 'N/A'}
Fecha Registro: ${currentObra.fecha_registro || 'N/A'}
Fecha Adquisición: ${currentObra.fecha_adquisicion || 'N/A'}
Fecha Venta: ${currentObra.fecha_venta || 'N/A'}
Asignación: ${currentObra.asignacion || 'N/A'}
Responsable: ${currentObra.responsable_nombre || currentObra.id_responsable || 'N/A'}
Provenance: ${prov}
Tags: ${tagsAsText(currentObra.tags) || 'N/A'}
Observaciones: ${currentObra.observaciones || 'Ninguna'}
        `.trim();

        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast("Información copiada al portapapeles");
        } catch (err) {
          showToast("Error al copiar", "error");
        }
        document.body.removeChild(textArea);
      };

      const handleSave = async (e) => {
        e.preventDefault();
        setSaving(true);
        const isNew = !obras.find(o => o.id === currentObra.id);
        const action = isNew ? 'registro_obra_add' : 'registro_obra_update';
        const tagsNormalized = Array.isArray(currentObra.tags)
          ? currentObra.tags
          : (currentObra.tags || '').toString().split(',').map(t => t.trim()).filter(Boolean);
        const payload = {
          ...currentObra,
          ancho: currentObra.ancho === '' || currentObra.ancho === null || currentObra.ancho === undefined ? 0 : ((parseFloat(currentObra.ancho) || 0) / 100),
          alto: currentObra.alto === '' || currentObra.alto === null || currentObra.alto === undefined ? 0 : ((parseFloat(currentObra.alto) || 0) / 100),
          largo: currentObra.largo === '' || currentObra.largo === null || currentObra.largo === undefined ? 0 : ((parseFloat(currentObra.largo) || 0) / 100),
          tags: tagsNormalized
        };
        try {
          const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, data: payload }) });
          const result = await res.json();
          if (result.result === 'success') {
            showToast("Guardado correctamente");
            await fetchAllData();
            setView("list");
          }
        } catch (e) { showToast("Error al guardar", "error"); }
        finally { setSaving(false); }
      };

      const formatCurrency = (v) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(v || 0);
      const tagsAsText = (tags) => Array.isArray(tags) ? tags.join(', ') : (tags || '');
      const uniqueValues = (items) => [...new Set(items.filter(Boolean).map(x => x.toString().trim()))].sort((a, b) => a.localeCompare(b, 'es-MX'));
      const statusOptions = useMemo(() => uniqueValues(obras.map(o => o.estatus)), [obras]);
      const tipoOptions = useMemo(() => uniqueValues(obras.map(o => o.tipo_obra)), [obras]);
      const provenanceOptions = useMemo(() => uniqueValues(obras.map(o => comisiones.find(c => c.id === o.provenance)?.provenance || o.provenance)), [obras, comisiones]);
      const autorOptions = useMemo(() => uniqueValues(obras.map(o => o.autor)), [obras]);

      const filtered = [...obras].reverse().filter(o => 
        (
          (o.nombre_obra || "").toLowerCase().includes(search.toLowerCase()) ||
          (o.clave || "").toLowerCase().includes(search.toLowerCase())
        ) &&
        (!filterStatus || (o.estatus || '') === filterStatus) &&
        (!filterTipo || (o.tipo_obra || '') === filterTipo) &&
        (!filterProvenance || (comisiones.find(c => c.id === o.provenance)?.provenance || o.provenance || '') === filterProvenance) &&
        (!filterAutor || (o.autor || '') === filterAutor)
      );

      const recentObras = recentIds.map(id => obras.find(o => o.id === id)).filter(Boolean);

      // --- RENDERIZADO DE VISTAS ---

      if (view === "list") return (
        <div className="min-h-screen">
          <header className="sticky top-0 z-10 glass-header p-4 border-b">
            <h1 className="text-2xl font-bold text-slate-800 mb-4">Registro de Obra</h1>
            <div className="relative">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><IconSearch /></span>
              <input type="text" placeholder="Buscar por nombre o clave..." className="w-full pl-10 pr-4 py-3 bg-white border rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-indigo-500" value={search} onChange={e => setSearch(e.target.value)} />
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 mt-3">
              <select className="w-full px-3 py-2 bg-white border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
                <option value="">Estatus: Todos</option>
                {statusOptions.map(v => <option key={v} value={v}>{v}</option>)}
              </select>
              <select className="w-full px-3 py-2 bg-white border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" value={filterTipo} onChange={e => setFilterTipo(e.target.value)}>
                <option value="">Tipo: Todos</option>
                {tipoOptions.map(v => <option key={v} value={v}>{v}</option>)}
              </select>
              <select className="w-full px-3 py-2 bg-white border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" value={filterProvenance} onChange={e => setFilterProvenance(e.target.value)}>
                <option value="">Provenance: Todos</option>
                {provenanceOptions.map(v => <option key={v} value={v}>{v}</option>)}
              </select>
              <select className="w-full px-3 py-2 bg-white border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" value={filterAutor} onChange={e => setFilterAutor(e.target.value)}>
                <option value="">Autor: Todos</option>
                {autorOptions.map(v => <option key={v} value={v}>{v}</option>)}
              </select>
            </div>
          </header>
          <main className="p-4 space-y-4">
            {!loading && recentObras.length > 0 && (
              <div>
                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Vistas Recientemente</h2>
                <div className="space-y-2">
                  {recentObras.map(o => (
                    <div key={o.id} onClick={() => openDetail(o)} role="button" tabIndex={0} onKeyDown={(e) => activateOnKey(e, () => openDetail(o))} className="bg-indigo-50 border border-indigo-100 p-3 rounded-2xl active:scale-95 transition-all flex justify-between items-center">
                      <div className="min-w-0">
                        <h3 className="font-semibold text-slate-800 text-sm leading-tight truncate">{o.nombre_obra}</h3>
                        <p className="text-[10px] text-slate-400 font-mono">#{o.clave}</p>
                      </div>
                      <span className="text-[10px] font-bold bg-indigo-100 text-indigo-600 px-2 py-1 rounded uppercase tracking-wider ml-2 shrink-0">{o.estatus}</span>
                    </div>
                  ))}
                </div>
                <div className="border-t mt-4 pt-4">
                  <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Todas las Obras</h2>
                </div>
              </div>
            )}
            {loading ? <BoxLoader message="Obteniendo registros..." /> : (
              <ul className="space-y-3">
                {filtered.map(o => (
                  <li key={o.id} onClick={() => openDetail(o)} role="button" tabIndex={0} onKeyDown={(e) => activateOnKey(e, () => openDetail(o))} className="bg-white p-4 rounded-2xl shadow-sm border active:scale-95 transition-all">
                    <div className="flex justify-between items-start mb-2 gap-3">
                      <h3 className="font-bold text-slate-800 leading-tight">{o.nombre_obra}</h3>
                      <span className="text-[10px] font-bold bg-indigo-50 text-indigo-600 px-2 py-1 rounded uppercase tracking-wider shrink-0">{o.estatus}</span>
                    </div>
                    <div className="flex items-center justify-between text-xs">
                      <p className="text-slate-500 font-mono">#{o.clave || '-'}</p>
                      {(() => {
                        const hasAdjuntos = Array.isArray(o.adjuntos) ? o.adjuntos.length > 0 : false;
                        return (
                          <span className={hasAdjuntos ? "text-indigo-600" : "text-slate-300"} title={hasAdjuntos ? "Con archivos adjuntos" : "Sin archivos adjuntos"}>
                            <IconPaperclip />
                          </span>
                        );
                      })()}
                    </div>
                  </li>
                ))}
              </ul>
            )}
            {!loading && filtered.length === 0 && (
              <div className="bg-white border rounded-2xl p-4 text-sm text-slate-500">No hay obras que coincidan con los filtros.</div>
            )}
          </main>
          <button onClick={handleCreateNewObra} className="fixed bottom-6 right-6 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-all"><IconPlus /></button>
          <Toast {...toast} onClose={() => setToast({ message: '', type: '' })} />
        </div>
      );

      if (view === "detail") return (
        <div className="min-h-screen bg-slate-50 pb-20">
          <nav className="sticky top-0 bg-white border-b p-4 flex justify-between items-center z-10 shadow-sm">
            <button onClick={() => setView("list")} className="p-2 text-slate-600"><IconBack /></button>
            <h2 className="font-bold text-slate-800 truncate px-4">Vista de Obra</h2>
            <div className="flex gap-1">
              <button onClick={handleCopyInfo} className="p-2 text-indigo-600 hover:bg-indigo-50 rounded-full" title="Copiar Información"><IconCopy /></button>
              <button onClick={() => setView("form")} className="p-2 text-indigo-600 hover:bg-indigo-50 rounded-full" title="Editar"><IconEdit /></button>
            </div>
          </nav>
          <div className="p-4 space-y-4 max-w-lg mx-auto">
             <div className="bg-white p-6 rounded-2xl border shadow-sm">
               <div className="flex justify-between items-start mb-4">
                 <div>
                   <span className="text-xs font-bold text-indigo-500 uppercase tracking-widest">{currentObra.clave}</span>
                   <h1 className="text-2xl font-black text-slate-900">{currentObra.nombre_obra}</h1>
                 </div>
                 <span className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-[10px] font-bold uppercase">{currentObra.estatus}</span>
               </div>
               <div className="space-y-3 pt-4 border-t">
                 <div className="grid grid-cols-2 gap-4">
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Tipo de Obra</p><p className="text-sm text-slate-700">{currentObra.tipo_obra || "No especificado"}</p></div>
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Autor</p><p className="text-sm text-slate-700">{currentObra.autor || "No especificado"}</p></div>
                 </div>
                 <div><p className="text-[10px] text-slate-400 font-bold uppercase">Ubicación</p><p className="text-sm text-slate-700">{currentObra.ubicacion || "No especificada"}</p></div>
                 <div className="grid grid-cols-2 gap-4">
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Precio Lista</p><p className="text-lg font-black text-indigo-600">{formatCurrency(currentObra.precio_lista)}</p></div>
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Precio Venta</p><p className="text-lg font-black text-emerald-600">{formatCurrency(currentObra.precio_venta)}</p></div>
                 </div>
                 <div className="grid grid-cols-2 gap-4">
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Superficie</p><p className="text-sm font-medium text-slate-700">{currentObra.superficie} m²</p></div>
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Cliente</p><p className="text-sm font-medium text-slate-700">{currentObra.cliente || "-"}</p></div>
                 </div>
                 <div className="grid grid-cols-3 gap-4">
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Ancho</p><p className="text-sm font-medium text-slate-700">{currentObra.ancho || "-"} cm</p></div>
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Alto</p><p className="text-sm font-medium text-slate-700">{currentObra.alto || "-"} cm</p></div>
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Largo</p><p className="text-sm font-medium text-slate-700">{currentObra.largo || "-"} cm</p></div>
                 </div>
               </div>
             </div>
             <div className="bg-white p-6 rounded-2xl border shadow-sm">
               <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Información Extra</h3>
               <div className="space-y-4">
                 <div className="grid grid-cols-3 gap-4">
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Fecha Registro</p><p className="text-sm text-slate-700">{currentObra.fecha_registro || "-"}</p></div>
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Fecha Adquisición</p><p className="text-sm text-slate-700">{currentObra.fecha_adquisicion || "-"}</p></div>
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Fecha Venta</p><p className="text-sm text-slate-700">{currentObra.fecha_venta || "-"}</p></div>
                 </div>
                 <div><p className="text-[10px] text-slate-400 font-bold uppercase">Provenance</p><p className="text-sm text-slate-700">{comisiones.find(c => c.id === currentObra.provenance)?.provenance || currentObra.provenance || "-"}</p></div>
                 <div className="grid grid-cols-2 gap-4">
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Asignación</p><p className="text-sm text-slate-700">{currentObra.asignacion || "-"}</p></div>
                   <div><p className="text-[10px] text-slate-400 font-bold uppercase">Responsable</p><p className="text-sm text-slate-700">{currentObra.responsable_nombre || currentObra.id_responsable || "-"}</p></div>
                 </div>
                 <div><p className="text-[10px] text-slate-400 font-bold uppercase">Tags</p><p className="text-sm text-slate-700">{tagsAsText(currentObra.tags) || "-"}</p></div>
                 <div><p className="text-[10px] text-slate-400 font-bold uppercase">Observaciones</p><p className="text-sm text-slate-700 whitespace-pre-wrap">{currentObra.observaciones || "Sin observaciones."}</p></div>
               </div>
             </div>
             {currentObra.documentos && currentObra.documentos.length > 0 && (
               <div className="bg-white p-6 rounded-2xl border shadow-sm">
                 <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Documentos</h3>
                 <div className="space-y-2">
                   {currentObra.documentos.map((d, i) => (
                     <a key={d.id || i} href={d.url} target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 p-3 bg-slate-50 border rounded-xl">
                       <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-indigo-500 shrink-0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                       <p className="text-xs font-medium text-slate-700 truncate">{d.name || d.url}</p>
                     </a>
                   ))}
                 </div>
               </div>
             )}
             {currentObra.adjuntos && currentObra.adjuntos.length > 0 && (
               <div className="bg-white p-6 rounded-2xl border shadow-sm">
                 <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Adjuntos</h3>
                 <div className="grid grid-cols-2 gap-2">
                   {currentObra.adjuntos.map(a => (
                     <a key={a.id} href={a.url} target="_blank" rel="noopener noreferrer" className="p-2 bg-slate-50 border rounded-xl overflow-hidden">
                       {a.mimeType?.includes('image') && <img src={`https://drive.google.com/thumbnail?id=${a.id}&sz=w200`} className="w-full h-20 object-cover rounded mb-1" />}
                       <p className="text-[9px] truncate font-medium">{a.name}</p>
                     </a>
                   ))}
                 </div>
               </div>
             )}
          </div>
          <Toast {...toast} onClose={() => setToast({ message: '', type: '' })} />
        </div>
      );

      if (view === "form") return (
        <div className="min-h-screen bg-white">
          <nav className="sticky top-0 bg-indigo-600 text-white p-4 flex justify-between items-center z-10 shadow-lg">
            <button onClick={() => setView(obras.find(o => o.id === currentObra.id) ? "detail" : "list")} className="p-2"><IconBack /></button>
            <h2 className="font-bold">Formulario de Obra</h2>
            <div className="w-8"></div>
          </nav>
          <form onSubmit={handleSave} className="p-4 space-y-6 max-w-lg mx-auto">
            <div className="space-y-4">
              <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Nombre</label><input required type="text" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.nombre_obra} onChange={e => setCurrentObra({...currentObra, nombre_obra: e.target.value})} /></div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Clave (Bloqueado)</label><input readOnly type="text" className="w-full p-3 bg-slate-100 border rounded-xl outline-none text-slate-400" value={currentObra.clave} /></div>
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Estatus</label>
                  <select className="w-full p-3 bg-slate-50 border rounded-xl outline-none" value={currentObra.estatus} onChange={e => setCurrentObra({...currentObra, estatus: e.target.value})}>
                    <option value="Consolidación">Consolidación</option><option value="Bodega">Bodega</option><option value="Vendida">Vendida</option>
                  </select>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Asignación</label><input readOnly type="text" title="La asignación se genera automáticamente al guardar." aria-describedby="asignacion-help" className="w-full p-3 bg-slate-100 border rounded-xl outline-none text-slate-400" value={currentObra.asignacion || ''} /><p id="asignacion-help" className="text-[10px] text-slate-400 mt-1 ml-1">Se genera automáticamente al guardar.</p></div>
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">ID Responsable</label><input type="text" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.id_responsable || ''} onChange={e => setCurrentObra({...currentObra, id_responsable: e.target.value})} /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Tipo de Obra</label><input type="text" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.tipo_obra || ''} onChange={e => setCurrentObra({...currentObra, tipo_obra: e.target.value})} /></div>
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Autor</label><input type="text" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.autor || ''} onChange={e => setCurrentObra({...currentObra, autor: e.target.value})} /></div>
              </div>
              <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Ubicación</label><input type="text" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.ubicacion} onChange={e => setCurrentObra({...currentObra, ubicacion: e.target.value})} /></div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Precio Lista</label><input type="number" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.precio_lista} onChange={e => setCurrentObra({...currentObra, precio_lista: e.target.value})} /></div>
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Precio Venta</label><input type="number" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.precio_venta || ''} onChange={e => setCurrentObra({...currentObra, precio_venta: e.target.value})} /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Superficie (m²)</label><input type="number" step="any" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.superficie || ''} onChange={e => setCurrentObra({...currentObra, superficie: e.target.value})} /></div>
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Cliente</label><input type="text" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.cliente || ''} onChange={e => setCurrentObra({...currentObra, cliente: e.target.value})} /></div>
              </div>
              <div className="grid grid-cols-3 gap-4">
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Fecha Registro</label><input type="date" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.fecha_registro || ''} onChange={e => setCurrentObra({...currentObra, fecha_registro: e.target.value})} /></div>
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Fecha Adquisición</label><input type="date" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.fecha_adquisicion || ''} onChange={e => setCurrentObra({...currentObra, fecha_adquisicion: e.target.value})} /></div>
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Fecha Venta</label><input type="date" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.fecha_venta || ''} onChange={e => setCurrentObra({...currentObra, fecha_venta: e.target.value})} /></div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Provenance</label>
                  <select className="w-full p-3 bg-slate-50 border rounded-xl outline-none" value={currentObra.provenance} onChange={e => setCurrentObra({...currentObra, provenance: e.target.value})}>
                    <option value="">Seleccionar...</option>
                    {comisiones.map(c => <option key={c.id} value={c.id}>{c.provenance}</option>)}
                  </select>
                </div>
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Tags (separados por coma)</label><input type="text" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={tagsAsText(currentObra.tags)} onChange={e => setCurrentObra({...currentObra, tags: e.target.value})} /></div>
              </div>
              <div className="grid grid-cols-3 gap-4">
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Ancho (cm)</label><input type="number" step="any" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.ancho || ''} onChange={e => setCurrentObra({...currentObra, ancho: e.target.value})} /></div>
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Alto (cm)</label><input type="number" step="any" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.alto || ''} onChange={e => setCurrentObra({...currentObra, alto: e.target.value})} /></div>
                <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Largo (cm)</label><input type="number" step="any" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.largo || ''} onChange={e => setCurrentObra({...currentObra, largo: e.target.value})} /></div>
              </div>
              <div><label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Observaciones</label><textarea rows="3" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" value={currentObra.observaciones} onChange={e => setCurrentObra({...currentObra, observaciones: e.target.value})} /></div>
            </div>
            <button disabled={saving} type="submit" className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg flex justify-center items-center gap-2 active:scale-95 transition-all">
              {saving ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin" /> : <><IconSave /> Guardar Registro</>}
            </button>
          </form>
          <Toast {...toast} onClose={() => setToast({ message: '', type: '' })} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
