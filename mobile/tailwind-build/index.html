<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="./output.css">
  <script>
    // Detección de dispositivo móvil: si se abre esta versión de escritorio
    // desde un móvil/tablet, redirige automáticamente a la versión móvil (index.html).
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var isMobileUA = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile/i.test(ua);
      var isCoarsePointer = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      var isNarrowViewport = Math.min(window.innerWidth, window.innerHeight) <= 820;
      if (isMobileUA || (isCoarsePointer && isNarrowViewport)) {
        window.location.replace("./mobile.html");
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617">
  <link rel="icon" type="image/png" href="./icon.png">

  <title>Gestor de Obras Pro — Escritorio</title>

  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.20/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3f51b5">

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color .2s ease, color .2s ease;
      -webkit-tap-highlight-color: transparent;
      background-color: #070a0e;
      color: #f4f4f5;
    }
    .glass-header {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-nav {
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
    }
    @keyframes bounce-custom {
      0%, 100% { transform: scaleY(0.3); opacity: 0.5; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    .animate-box-bounce {
      animation: bounce-custom 1s infinite ease-in-out;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px;}
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #2a2f38; border-radius: 20px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #2a2f38; }

    .pb-safe-nav { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
    .pt-safe { padding-top: env(safe-area-inset-top); }

    /* ===== SIDEBAR RTBROK ===== */
    .rtbrok-sidebar {
      width: 220px;
      background: #080b10;
      border-right: 1px solid #1b2028;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 12px;
      height: 100vh;
      flex-shrink: 0;
      z-index: 40;
    }
    .rtbrok-sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 70px;
      padding: 0 4px;
      margin-bottom: 12px;
    }
    .rtbrok-sidebar-brand img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 70px;
      object-fit: contain;
    }
    .rtbrok-sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .rtbrok-sidebar-link {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      min-height: 48px;
      color: #d4d4d8;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: 'Inter', sans-serif;
    }
    .rtbrok-sidebar-link:hover {
      background: #171a20;
      color: #ffffff;
    }
    .rtbrok-sidebar-link.active {
      background: #1a1f28;
      color: #ffffff;
    }
    .rtbrok-sidebar-link .icon-wrap {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #a1a1aa;
    }
    .rtbrok-sidebar-link:hover .icon-wrap,
    .rtbrok-sidebar-link.active .icon-wrap {
      color: #ffffff;
    }
    .rtbrok-sidebar-link span {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .rtbrok-sidebar-footer {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #1b2028;
      gap: 6px;
    }
    .rtbrok-sidebar-footer button {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(23, 26, 32, 0.6);
      border: 1px solid #1f242c;
      border-radius: 6px;
      color: #a1a1aa;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .rtbrok-sidebar-footer button:hover {
      background: #1f242c;
      color: #ffffff;
    }

    /* ===== TOPBAR SECUNDARIO (menú de la app) ===== */
    .ps-topbar {
      height: 52px;
      background: #080b10;
      border-bottom: 1px solid #1b2028;
      box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 2px 8px rgba(0,0,0,0.4);
    }
    .ps-topbar-inner {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      max-width: 1800px;
      margin: 0 auto;
    }
    .ps-topbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #f1f5f9;
      padding-right: 16px;
      margin-right: 10px;
      border-right: 1px solid #1f242c;
      white-space: nowrap;
    }
    .ps-topbar-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: #6366f1;
      display: inline-block;
    }
    .ps-menu-group {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 100%;
    }
    .ps-menu-divider {
      width: 1px;
      height: 24px;
      background: #1f242c;
      margin-right: 8px;
    }
    .ps-menu-item {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #9ca3af;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .ps-menu-item:hover {
      background: #171a20;
      color: #ffffff;
    }
    .ps-menu-item.active {
      background: #4f46e5;
      color: #ffffff;
    }
    .ps-menu-item.ps-menu-item-disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .ps-menu-item.ps-menu-item-disabled:hover {
      background: transparent;
      color: #9ca3af;
    }
    .ps-menu-item svg {
      width: 15px;
      height: 15px;
    }
    .ps-topbar-spacer {
      flex: 1;
    }
    .ps-topbar-hint {
      font-size: 10px;
      color: #4b5563;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .suggestions-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 50;
      background: #0d1117;
      border: 1px solid #1a2029;
      border-radius: 12px;
      margin-top: 4px;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .suggestion-item {
      padding: 8px 16px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
      border-bottom: 1px solid #1a2029;
      color: #d4d4d8;
    }
    .suggestion-item:last-child {
      border-bottom: none;
    }
    .suggestion-item:hover {
      background: #171a20;
    }
    .suggestion-highlight {
      font-weight: 700;
      color: #818cf8;
    }
    .suggestion-wrapper {
      position: relative;
    }

    .prov-modal-overlay, .tec-modal-overlay, .autor-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }
    .prov-modal-overlay.hidden, .tec-modal-overlay.hidden, .autor-modal-overlay.hidden {
      display: none;
    }
    .prov-modal, .tec-modal, .autor-modal {
      background: #0d1117;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      animation: slideUp 0.25s ease;
      border: 1px solid #1a2029;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .prov-modal h3, .tec-modal h3, .autor-modal h3 {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .prov-modal .subtitle, .tec-modal .subtitle, .autor-modal .subtitle {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 20px;
    }
    .prov-modal label, .tec-modal label, .autor-modal label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .prov-modal input, .prov-modal select,
    .tec-modal input, .tec-modal select,
    .autor-modal input, .autor-modal select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #1f242c;
      border-radius: 12px;
      font-size: 15px;
      background: #070a0e;
      color: #f1f5f9;
      outline: none;
      transition: border-color 0.2s;
    }
    .prov-modal input:focus, .prov-modal select:focus,
    .tec-modal input:focus, .tec-modal select:focus,
    .autor-modal input:focus, .autor-modal select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }
    .prov-modal .btn-row, .tec-modal .btn-row, .autor-modal .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .prov-modal .btn-row button, .tec-modal .btn-row button, .autor-modal .btn-row button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.15s;
      cursor: pointer;
      border: none;
    }
    .prov-modal .btn-cancel, .tec-modal .btn-cancel, .autor-modal .btn-cancel {
      background: #1a2029;
      color: #9ca3af;
    }
    .prov-modal .btn-cancel:hover, .tec-modal .btn-cancel:hover, .autor-modal .btn-cancel:hover {
      background: #242a33;
    }
    .prov-modal .btn-save, .tec-modal .btn-save, .autor-modal .btn-save {
      background: #4f46e5;
      color: white;
    }
    .prov-modal .btn-save:hover, .tec-modal .btn-save:hover, .autor-modal .btn-save:hover {
      background: #4338ca;
    }
    .prov-modal .btn-save:disabled, .tec-modal .btn-save:disabled, .autor-modal .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .prov-modal .btn-danger, .tec-modal .btn-danger, .autor-modal .btn-danger {
      background: #b91c1c;
      color: white;
    }
    .prov-modal .btn-danger:hover, .tec-modal .btn-danger:hover, .autor-modal .btn-danger:hover {
      background: #991b1b;
    }
    .prov-modal .btn-danger:disabled, .tec-modal .btn-danger:disabled, .autor-modal .btn-danger:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .prov-modal .error-msg, .tec-modal .error-msg, .autor-modal .error-msg {
      color: #f87171;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    .prov-modal .error-msg.visible, .tec-modal .error-msg.visible, .autor-modal .error-msg.visible {
      display: block;
    }
    .prov-modal .hint-text, .tec-modal .hint-text, .autor-modal .hint-text {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
    }

    /* ===== MODAL DE IMAGEN (copiar / descargar) ===== */
    .img-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }
    .img-modal {
      background: #0d1117;
      border: 1px solid #1a2029;
      border-radius: 20px;
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      animation: slideUp 0.25s ease;
    }
    .img-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .img-modal-name {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      font-weight: 700;
      color: #9ca3af;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .img-modal-close {
      background: transparent;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }
    .img-modal-close:hover { color: #fff; }
    .img-modal-preview {
      background: #070a0e;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .img-modal-preview img {
      display: block;
      max-width: 100%;
      max-height: 55vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .img-modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .img-modal-actions button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #1f242c;
      transition: all 0.15s;
    }
    .img-modal-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
    .img-modal-actions .btn-copy { background: #1a2029; color: #f1f5f9; }
    .img-modal-actions .btn-copy:hover:not(:disabled) { background: #242a33; }
    .img-modal-actions .btn-download { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    .img-modal-actions .btn-download:hover:not(:disabled) { background: #4338ca; }

    .discover-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      padding: 2px;
    }
    @media (min-width: 768px) {
      .discover-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }
    .discover-grid .grid-item {
      aspect-ratio: 3 / 4;
      overflow: hidden;
      cursor: pointer;
      background: #0d1117;
      position: relative;
    }
    .discover-grid .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .discover-grid .grid-item:hover img {
      transform: scale(1.05);
    }
    .catalog-card-info {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 28px 8px 8px;
      color: white;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
      pointer-events: none;
    }
    .catalog-card-info p {
      overflow: hidden;
      margin: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .catalog-card-title {
      font-size: 12px;
      font-weight: 800;
    }
    .catalog-card-meta {
      margin-top: 2px !important;
      color: rgba(255, 255, 255, 0.82);
      font-size: 9px;
      font-weight: 600;
    }
    .catalog-card-price {
      margin-top: 4px !important;
      color: #a7f3d0;
      font-size: 11px;
      font-weight: 800;
    }
    .discover-grid .grid-item .fallback-text {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      font-size: 10px;
      font-weight: 600;
      color: #6b7280;
      text-align: center;
      padding: 8px;
      word-break: break-word;
      background: #0d1117;
    }

    .tags-suggestions {
      position: absolute;
      z-index: 20;
      width: 100%;
      margin-top: 4px;
      background: #0d1117;
      border: 1px solid #1a2029;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-height: 160px;
      overflow-y: auto;
    }
    .tags-suggestion-item {
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1a2029;
      color: #d4d4d8;
    }
    .tags-suggestion-item:last-child {
      border-bottom: none;
    }
    .tags-suggestion-item:hover {
      background: #171a20;
    }
    .tags-suggestion-item .hash {
      color: #818cf8;
      font-weight: 700;
    }

    .commission-type-toggle {
      display: inline-flex;
      background: #1a2029;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }
    .commission-type-toggle button {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      transition: all 0.15s ease;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #9ca3af;
    }
    .commission-type-toggle button.active {
      background: #4f46e5;
      color: white;
      box-shadow: 0 1px 4px rgba(79, 70, 229, 0.35);
    }

    /* ===== APP LAYOUT ===== */
    .app-container {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #070a0e;
    }
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .app-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Responsive sidebar */
    @media (max-width: 1024px) {
      .rtbrok-sidebar {
        width: 78px;
        padding: 16px 8px;
        align-items: center;
      }
      .rtbrok-sidebar-brand {
        padding: 0;
        justify-content: center;
        width: 48px;
        height: 48px;
        margin-bottom: 8px;
      }
      .rtbrok-sidebar-brand img {
        max-height: 40px;
        max-width: 40px;
      }
      .rtbrok-sidebar-link {
        flex-direction: column;
        padding: 7px 3px;
        gap: 3px;
        min-height: 52px;
      }
      .rtbrok-sidebar-link span {
        font-size: 9px;
        text-align: center;
      }
      .rtbrok-sidebar-link .icon-wrap {
        width: 28px;
        height: 28px;
      }
      .rtbrok-sidebar-footer {
        flex-direction: column;
      }
    }
    @media (max-width: 640px) {
      .rtbrok-sidebar {
        display: none;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen overscroll-y-none">
  <div id="root"></div>

  <script src="app.js"></script>
</body>
</html>
