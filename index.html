<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#317EFB">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Panel de Finanzas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* ── Header ── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 16px 20px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(37,99,235,.4);
    }
    header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -.3px; }
    header p  { font-size: .75rem; opacity: .8; margin-top: 2px; }

    /* ── Container ── */
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }

    /* ── Summary cards ── */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 10px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .summary-card .label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .summary-card .amount { font-size: 1rem; font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .summary-card.income  .amount { color: var(--success); }
    .summary-card.expense .amount { color: var(--danger); }
    .summary-card.balance .amount { color: var(--primary); }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-header h2 { font-size: .95rem; font-weight: 600; }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .filter-btn {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: .8rem;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ── Search ── */
    .search-box {
      position: relative;
      margin-bottom: 14px;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: .9rem;
      background: var(--card);
      outline: none;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }

    /* ── Transaction list ── */
    .tx-list { display: flex; flex-direction: column; gap: 10px; }
    .tx-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .tx-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1rem;
    }
    .tx-icon.income  { background: #dcfce7; color: var(--success); }
    .tx-icon.expense { background: #fee2e2; color: var(--danger); }
    .tx-body { flex: 1; min-width: 0; }
    .tx-title { font-size: .9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta  { font-size: .75rem; color: var(--muted); margin-top: 2px; }
    .tx-tag {
      display: inline-block;
      background: #eff6ff;
      color: var(--primary);
      border-radius: 8px;
      padding: 1px 7px;
      font-size: .68rem;
      margin-top: 4px;
    }
    .tx-right { text-align: right; flex-shrink: 0; }
    .tx-amount { font-size: .95rem; font-weight: 700; }
    .tx-amount.income  { color: var(--success); }
    .tx-amount.expense { color: var(--danger); }
    .tx-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }
    .icon-btn {
      border: none;
      background: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: background .15s;
      color: var(--muted);
    }
    .icon-btn:hover { background: var(--bg); }
    .icon-btn.delete:hover { color: var(--danger); }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-state svg { margin-bottom: 12px; }
    .empty-state p { font-size: .9rem; }

    /* ── Loading ── */
    .loading { text-align: center; padding: 30px; color: var(--muted); font-size: .9rem; }
    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FAB ── */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      border: none;
      box-shadow: 0 4px 12px rgba(37,99,235,.5);
      font-size: 1.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: transform .15s, background .15s;
    }
    .fab:hover { background: var(--primary-dark); transform: scale(1.06); }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 300;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 20px 20px 32px;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 20px; }

    /* ── Form ── */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: .92rem;
      outline: none;
      background: var(--bg);
      transition: border-color .15s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--primary); background: #fff; }

    /* tipo toggle */
    .tipo-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tipo-btn {
      padding: 10px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all .15s;
    }
    .tipo-btn[data-value="ingreso"].selected  { border-color: var(--success); background: #dcfce7; color: var(--success); }
    .tipo-btn[data-value="egreso"].selected   { border-color: var(--danger);  background: #fee2e2; color: var(--danger); }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-size: .92rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      color: #fff;
      padding: 10px 22px;
      border-radius: 20px;
      font-size: .85rem;
      opacity: 0;
      transition: opacity .25s, transform .25s;
      z-index: 400;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Confirm dialog ── */
    .confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .confirm-overlay.open { display: flex; }
    .confirm-box {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .confirm-box h4 { font-size: 1rem; margin-bottom: 8px; }
    .confirm-box p  { font-size: .85rem; color: var(--muted); margin-bottom: 20px; }
    .confirm-box .btn-row { justify-content: center; }

    @media (min-width: 480px) {
      .summary-card .amount { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>💰 Panel de Finanzas</h1>
  <p id="headerDate"></p>
</header>

<div class="container">

  <!-- Summary cards -->
  <div class="summary-grid">
    <div class="summary-card income">
      <div class="label">Ingresos</div>
      <div class="amount" id="totalIngresos">—</div>
    </div>
    <div class="summary-card expense">
      <div class="label">Egresos</div>
      <div class="amount" id="totalEgresos">—</div>
    </div>
    <div class="summary-card balance">
      <div class="label">Balance</div>
      <div class="amount" id="totalBalance">—</div>
    </div>
  </div>

  <!-- Filter & search -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">Todos</button>
    <button class="filter-btn" data-filter="ingreso">Ingresos</button>
    <button class="filter-btn" data-filter="egreso">Egresos</button>
  </div>

  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="searchInput" placeholder="Buscar por concepto o categoría…" />
  </div>

  <!-- Section header -->
  <div class="section-header">
    <h2>Transacciones</h2>
    <span id="txCount" style="font-size:.8rem;color:var(--muted)"></span>
  </div>

  <!-- List -->
  <div id="txContainer">
    <div class="loading"><div class="spinner"></div><br>Cargando datos…</div>
  </div>

</div>

<!-- FAB -->
<button class="fab" id="fabAdd" title="Nueva transacción">+</button>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="modalTitle">Nueva Transacción</h3>

    <div class="form-group">
      <label>Tipo</label>
      <div class="tipo-toggle">
        <button class="tipo-btn selected" data-value="ingreso" id="btnIngreso">📈 Ingreso</button>
        <button class="tipo-btn"          data-value="egreso"  id="btnEgreso" >📉 Egreso</button>
      </div>
    </div>

    <div class="form-group">
      <label for="fMonto">Monto *</label>
      <input type="number" id="fMonto" placeholder="0.00" step="0.01" min="0" />
    </div>

    <div class="form-group">
      <label for="fConcepto">Concepto *</label>
      <input type="text" id="fConcepto" placeholder="Descripción breve" />
    </div>

    <div class="form-group">
      <label for="fFecha">Fecha *</label>
      <input type="date" id="fFecha" />
    </div>

    <div class="form-group">
      <label for="fCategoria">Categoría</label>
      <input type="text" id="fCategoria" placeholder="Ej: Ventas, Nómina, Renta…" list="categoriasList" />
      <datalist id="categoriasList"></datalist>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btnCancelModal">Cancelar</button>
      <button class="btn btn-primary"   id="btnSaveModal">Guardar</button>
    </div>
  </div>
</div>

<!-- Confirm delete -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h4>¿Eliminar registro?</h4>
    <p>Esta acción no se puede deshacer.</p>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnCancelDelete">Cancelar</button>
      <button class="btn btn-primary"   id="btnConfirmDelete" style="background:var(--danger)">Eliminar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
   if ('serviceWorker' in navigator) {
   window.addEventListener('load', () => {
     navigator.serviceWorker.register('/sw.js')
       .then(reg => console.log('Service Worker registrado con éxito', reg))
       .catch(err => console.warn('Error al registrar el Service Worker', err));
   });
 }

  const API = 'https://script.google.com/macros/s/AKfycbxmPBIboe_Evn45ZHjtkjydbmlPRMuSax_sEiTc2iN8cqqi2i4-Pf_lOd6875cQXEd_yg/exec';

  // ── State ──────────────────────────────────────────────
  let allTx      = [];   // all finanzas records
  let activeFilter = 'all';
  let searchQuery  = '';
  let editingId    = null;
  let deletingId   = null;
  let selectedTipo = 'ingreso';

  // ── Init ───────────────────────────────────────────────
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('es-MX', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  setTodayDate();
  loadData();

  // ── Load data ──────────────────────────────────────────
  async function loadData() {
    showLoading();
    try {
      const res  = await fetch(API);
      const json = await res.json();
      allTx = (json.finanzas || []).filter(r => r.tipo === 'ingreso' || r.tipo === 'egreso');
      // Sort newest first
      allTx.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
      populateCategorias();
      updateSummary();
      renderList();
    } catch (err) {
      showError('No se pudo conectar con el servidor. Verifica tu conexión.');
      console.error(err);
    }
  }

  // ── Summary ────────────────────────────────────────────
  function updateSummary() {
    const ingresos = allTx.filter(r => r.tipo === 'ingreso').reduce((s, r) => s + r.monto, 0);
    const egresos  = allTx.filter(r => r.tipo === 'egreso' ).reduce((s, r) => s + r.monto, 0);
    const balance  = ingresos - egresos;

    document.getElementById('totalIngresos').textContent = fmt(ingresos);
    document.getElementById('totalEgresos') .textContent = fmt(egresos);
    const balEl = document.getElementById('totalBalance');
    balEl.textContent = fmt(balance);
    balEl.style.color = balance >= 0 ? 'var(--success)' : 'var(--danger)';
  }

  // ── Render list ────────────────────────────────────────
  function renderList() {
    const filtered = getFiltered();
    document.getElementById('txCount').textContent = `${filtered.length} registro${filtered.length !== 1 ? 's' : ''}`;
    const container = document.getElementById('txContainer');

    if (!filtered.length) {
      container.innerHTML = `
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          <p>No hay transacciones${searchQuery ? ' para esa búsqueda' : ' aún'}.</p>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="tx-list">${filtered.map(txCard).join('')}</div>`;
    container.querySelectorAll('.icon-btn[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => openEdit(btn.dataset.edit));
    });
    container.querySelectorAll('.icon-btn[data-delete]').forEach(btn => {
      btn.addEventListener('click', () => openConfirmDelete(btn.dataset.delete));
    });
  }

  function txCard(r) {
    const isIncome = r.tipo === 'ingreso';
    const sign     = isIncome ? '+' : '-';
    const cls      = isIncome ? 'income' : 'expense';
    const icon     = isIncome ? '📈' : '📉';
    const fecha    = r.fecha ? formatDate(r.fecha) : '';
    const cat      = r.categoria ? `<span class="tx-tag">${esc(r.categoria)}</span>` : '';
    return `
      <div class="tx-card">
        <div class="tx-icon ${cls}">${icon}</div>
        <div class="tx-body">
          <div class="tx-title">${esc(r.concepto || '(sin concepto)')}</div>
          <div class="tx-meta">${fecha}</div>
          ${cat}
        </div>
        <div class="tx-right">
          <div class="tx-amount ${cls}">${sign}${fmt(r.monto)}</div>
          <div class="tx-actions">
            <button class="icon-btn" data-edit="${esc(r.id)}" title="Editar">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="icon-btn delete" data-delete="${esc(r.id)}" title="Eliminar">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </div>
      </div>`;
  }

  function getFiltered() {
    return allTx.filter(r => {
      if (activeFilter !== 'all' && r.tipo !== activeFilter) return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        if (!(r.concepto || '').toLowerCase().includes(q) &&
            !(r.categoria || '').toLowerCase().includes(q)) return false;
      }
      return true;
    });
  }

  // ── Filter buttons ──────────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderList();
    });
  });

  // ── Search ─────────────────────────────────────────────
  document.getElementById('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    renderList();
  });

  // ── Modal open/close ────────────────────────────────────
  document.getElementById('fabAdd').addEventListener('click', openAdd);

  function openAdd() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Nueva Transacción';
    document.getElementById('fMonto').value    = '';
    document.getElementById('fConcepto').value = '';
    document.getElementById('fCategoria').value= '';
    setTodayDate();
    setTipo('ingreso');
    openModal();
  }

  function openEdit(id) {
    const r = allTx.find(t => t.id === id);
    if (!r) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Editar Transacción';
    document.getElementById('fMonto').value    = r.monto;
    document.getElementById('fConcepto').value = r.concepto || '';
    document.getElementById('fCategoria').value= r.categoria || '';
    document.getElementById('fFecha').value    = r.fecha || '';
    setTipo(r.tipo || 'ingreso');
    openModal();
  }

  function openModal()  { document.getElementById('modalOverlay').classList.add('open'); }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

  document.getElementById('btnCancelModal').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  // ── Tipo toggle ────────────────────────────────────────
  document.querySelectorAll('.tipo-btn').forEach(btn => {
    btn.addEventListener('click', () => setTipo(btn.dataset.value));
  });

  function setTipo(val) {
    selectedTipo = val;
    document.querySelectorAll('.tipo-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.value === val);
    });
  }

  // ── Save ───────────────────────────────────────────────
  document.getElementById('btnSaveModal').addEventListener('click', saveTransaction);

  async function saveTransaction() {
    const monto    = parseFloat(document.getElementById('fMonto').value);
    const concepto = document.getElementById('fConcepto').value.trim();
    const fecha    = document.getElementById('fFecha').value;
    const categoria= document.getElementById('fCategoria').value.trim();

    if (isNaN(monto) || monto <= 0) { showToast('Ingresa un monto válido.'); return; }
    if (!concepto) { showToast('Ingresa un concepto.'); return; }
    if (!fecha) { showToast('Selecciona una fecha.'); return; }

    const btn = document.getElementById('btnSaveModal');
    btn.disabled = true;
    btn.textContent = 'Guardando…';

    const action = editingId ? 'finanza_update' : 'finanza_add';
    const data = {
      tipo: selectedTipo,
      monto,
      concepto,
      fecha,
      categoria
    };
    if (editingId) data.id = editingId;
    else data.id = 'fin_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);

    const ok = await postAction(action, data);
    btn.disabled = false;
    btn.textContent = 'Guardar';

    if (ok) {
      closeModal();
      showToast(editingId ? 'Transacción actualizada ✓' : 'Transacción agregada ✓');
      await loadData();
    }
  }

  // ── Delete ─────────────────────────────────────────────
  function openConfirmDelete(id) {
    deletingId = id;
    document.getElementById('confirmOverlay').classList.add('open');
  }
  function closeConfirm() {
    deletingId = null;
    document.getElementById('confirmOverlay').classList.remove('open');
  }

  document.getElementById('btnCancelDelete') .addEventListener('click', closeConfirm);
  document.getElementById('btnConfirmDelete').addEventListener('click', async () => {
    if (!deletingId) return;
    const btn = document.getElementById('btnConfirmDelete');
    btn.disabled = true;
    btn.textContent = 'Eliminando…';
    const ok = await postAction('finanza_delete', { id: deletingId });
    btn.disabled = false;
    btn.textContent = 'Eliminar';
    closeConfirm();
    if (ok) {
      showToast('Registro eliminado ✓');
      await loadData();
    }
  });

  // ── API helper ─────────────────────────────────────────
  async function postAction(action, data) {
    try {
      const res = await fetch(API, {
        method: 'POST',
        body: JSON.stringify({ action, data }),
        redirect: 'follow'
      });
      const json = await res.json();
      if (json && json.error) { showToast('Error: ' + json.error); return false; }
      return true;
    } catch (err) {
      showToast('Error de conexión. Intenta de nuevo.');
      console.error(err);
      return false;
    }
  }

  // ── Autocomplete categorías ────────────────────────────
  function populateCategorias() {
    const cats = [...new Set(allTx.map(r => r.categoria).filter(Boolean))];
    const dl = document.getElementById('categoriasList');
    dl.innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');
  }

  // ── Helpers ────────────────────────────────────────────
  function fmt(n) {
    return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 2 }).format(n || 0);
  }

  function formatDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const mIdx = parseInt(m, 10);
    if (mIdx < 1 || mIdx > 12) return iso;
    return `${parseInt(d, 10)} ${months[mIdx - 1]} ${y}`;
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function setTodayDate() {
    document.getElementById('fFecha').value = new Date().toISOString().split('T')[0];
  }

  function showLoading() {
    document.getElementById('txContainer').innerHTML = '<div class="loading"><div class="spinner"></div><br>Cargando datos…</div>';
  }

  function showError(msg) {
    document.getElementById('txContainer').innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p>${esc(msg)}</p>
      </div>`;
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
